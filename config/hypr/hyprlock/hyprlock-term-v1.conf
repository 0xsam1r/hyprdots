# GHOSTPUNK TERMINAL lockscreen
# A single terminal window in the middle of a dark, blurred screen.
# The password field is the shell prompt. Positions are in px, measured on 1920x1080
# (0,0 = screen center for everything below, +y goes up).

# ---------- palette ----------
$ice    = rgba(147, 206, 233, 1.0)
$muted  = rgba(147, 206, 233, 0.55)
$body   = rgba(200, 215, 225, 0.88)
$panel  = rgba(8, 12, 18, 0.82)
$danger = rgba(240, 113, 120, 1.0)

# ---------- fonts ----------
# Geist Mono for the big stuff, JetBrains Mono Nerd Font for text and glyphs.
# Pango falls back silently if one is missing: check with `fc-list | grep -i geist`.
$f_big  = Geist Mono Bold
$f_text = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = scan fingerprint to unlock
        present_message = scanning...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ---------- background: your screen, blurred and darkened ----------
background {
    monitor =
    path = screenshot
    # path = ~/.config/hypr/wallpapers/lock.jpg   # use a fixed image instead
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# ---------- terminal window ----------
shape {
    monitor =
    size = 700, 430
    color = $panel
    rounding = 14
    border_size = 1
    border_color = rgba(147, 206, 233, 0.35)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# title bar separator
shape {
    monitor =
    size = 700, 1
    color = rgba(147, 206, 233, 0.2)
    rounding = 0
    position = 0, 172
    halign = center
    valign = center
    zindex = 2
}

# window dots (three ice-blue shades)
label {
    monitor =
    text = ●
    color = rgba(147, 206, 233, 0.9)
    font_size = 12
    font_family = $f_text
    position = -320, 193
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = ●
    color = rgba(147, 206, 233, 0.55)
    font_size = 12
    font_family = $f_text
    position = -298, 193
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = ●
    color = rgba(147, 206, 233, 0.25)
    font_size = 12
    font_family = $f_text
    position = -276, 193
    halign = center
    valign = center
    zindex = 3
}

# window title
label {
    monitor =
    text = cmd[update:60000] echo "$(whoami)@$(hostname): ~/lock"
    color = $muted
    font_size = 13
    font_family = $f_text
    position = 0, 193
    halign = center
    valign = center
    zindex = 3
}

# ---------- clock ----------
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $ice
    font_size = 96
    font_family = $f_big
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
    shadow_boost = 1.0
    position = 0, 95
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %d %B %Y" | tr 'A-Z' 'a-z'
    color = $muted
    font_size = 16
    font_family = $f_text
    position = 0, 30
    halign = center
    valign = center
    zindex = 3
}

# ---------- shell-style info block ----------
label {
    monitor =
    text = cmd[update:30000] printf '❯ %-7s %s\n' user "$(whoami)" os "$(grep PRETTY_NAME /etc/os-release | cut -d'"' -f2)" kernel "$(uname -r)" uptime "$(uptime -p | sed 's/^up //')"
    text_align = left
    color = $body
    font_size = 15
    font_family = $f_text
    position = 0, -50
    halign = center
    valign = center
    zindex = 3
}

# ---------- password field = the prompt ----------
input-field {
    monitor =
    size = 620, 50
    outline_thickness = 1
    outer_color = rgba(147, 206, 233, 0.5)
    inner_color = rgba(147, 206, 233, 0.06)
    check_color = rgba(147, 206, 233, 1.0)
    fail_color = $danger
    font_color = $ice
    font_family = $f_text
    rounding = 8
    dots_text_format = *
    dots_spacing = 0.25
    dots_center = false
    fade_on_empty = false
    hide_input = false
    placeholder_text = <i>❯ password</i>
    fail_text = <b>✗</b> $FAIL <b>($ATTEMPTS)</b>
    fail_transition = 300
    capslock_color = rgba(240, 190, 110, 1.0)
    position = 0, -140
    halign = center
    valign = center
    zindex = 3
}

# fingerprint status
label {
    monitor =
    text = $FPRINTPROMPT
    color = $muted
    font_size = 12
    font_family = $f_text
    position = 0, -190
    halign = center
    valign = center
    zindex = 3
}

# keyboard layout, bottom-right of the window
label {
    monitor =
    text = [ $LAYOUT ]
    color = $muted
    font_size = 12
    font_family = $f_text
    position = 305, -190
    halign = center
    valign = center
    zindex = 3
}

# ---------- footer ----------
label {
    monitor =
    text = 󰊠  ghostpunk terminal
    color = rgba(147, 206, 233, 0.35)
    font_size = 13
    font_family = $f_text
    position = 0, 24
    halign = center
    valign = bottom
    zindex = 3
}
