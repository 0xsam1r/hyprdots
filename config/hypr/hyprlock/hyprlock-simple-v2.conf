#
# Style: layout1 (stacked HH / MM, date, greeting, pill input)
# Positions are in px and were measured on a 1920x1080 screen.

# ---------- colors (sampled from the screenshot) ----------
# To use wallust instead: uncomment the source line and set these four
# variables to names from your generated colors file.
# source = ~/.cache/wallust/hyprlock-colors.conf
$c_pink     = rgba(199, 128, 192, 1.0)
$c_blue     = rgba(107, 120, 201, 1.0)
$c_lavender = rgba(143, 154, 224, 1.0)
$c_pill     = rgba(160, 150, 210, 0.22)

# ---------- fonts ----------
# Run `fc-list | grep -i <name>` to check a font exists; pango falls back silently.
$f_clock = Inter Light
$f_text  = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    # skips validation when no password is provided
    ignore_empty_input = true
    immediate_render = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250 # in milliseconds
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ---------- background: heavily blurred + darkened ----------
background {
    monitor =
    path = screenshot
    # path = ~/.config/hypr/wallpapers/lock.jpg   # use a fixed image instead
    blur_passes = 3
    blur_size = 4
    contrast = 0.89
    brightness = 0.72
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# ---------- hour ----------
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $c_pink
    font_size = 150
    font_family = $f_clock
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(0, 0, 0)
    shadow_boost = 1.2
    position = 0, -250
    halign = center
    valign = top
}

# ---------- minutes ----------
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $c_blue
    font_size = 150
    font_family = $f_clock
    position = 0, -420
    halign = center
    valign = top
}

# ---------- date ----------
label {
    monitor =
    text = cmd[update:60000] date +"<b>%d %b %A</b>"
    color = $c_blue
    font_size = 14
    font_family = $f_text
    position = 0, -130
    halign = center
    valign = center
}

# ---------- greeting ----------
label {
    monitor =
    text = <i>Hi $USER :)</i>
    color = $c_lavender
    font_size = 17
    font_family = $f_text
    position = 0, -250
    halign = center
    valign = center
}

# ---------- input pill ----------
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    rounding = -1
    inner_color = $c_pill
    outer_color = rgba(0, 0, 0, 0)
    font_color = rgba(200, 200, 220, 0.55)
    font_family = Sans
    fade_on_empty = false
    placeholder_text = <i>Use Me ;)</i>
    fail_text = <i>$PAMFAIL</i>
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    hide_input = false
    position = 0, -370
    halign = center
    valign = center
}

# ---------- keyboard layout (kept from your old config, made subtle) ----------
label {
    monitor =
    text = $LAYOUT
    color = rgba(200, 200, 220, 0.4)
    font_size = 14
    font_family = $f_text
    position = 20, 20
    halign = left
    valign = bottom
}
