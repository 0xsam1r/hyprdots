# frame header: alert dot | name | ghost
label {
    monitor =
    text = ●
    color = $danger
    font_size = 12
    font_family = $f_text
    position = -200, 300
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
  text = cmd[update:60000] h=$(date +%H); if [ "$h" -lt 5 ]; then m="THE CASE CAN WAIT, $name"; elif [ "$h" -lt 12 ]; then m="GOOD MORNING, $name"; elif [ "$h" -lt 18 ]; then m="GOOD AFTERNOON, $name"; else m="GOOD EVENING, $name"; fi; printf '<span letter_spacing="4000"><i>%s</i></span>' "$m"
    color = $muted
    font_size = 13
    font_family = $f_text
    position = 0, 300
    halign = center
    valign = center
    zindex = 5
}

# hour: clear hue (ice glow)
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $ice
    font_size = 150
    font_family = $f_big
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(147, 206, 233, 0.55)
    shadow_boost = 1.2
    position = 0, 140
    halign = center
    valign = center
    zindex = 5
}

# minutes: cloudy hue (violet glow)
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $violet
    font_size = 150
    font_family = $f_big
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(150, 140, 230, 0.55)
    shadow_boost = 1.2
    position = 0, -30
    halign = center
    valign = center
    zindex = 5
}

# date
label {
    monitor =
    text = cmd[update:60000] printf '<span letter_spacing="6000">%s</span>' "$(date +'%a · %d %b %Y' | tr a-z A-Z)"
    color = $muted
    font_size = 17
    font_family = $f_text
    position = 0, -150
    halign = center
    valign = center
    zindex = 5
}

# input
input-field {
    monitor =
    size = 400, 52
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(147, 206, 233, 0.75)
    inner_color = rgba(147, 206, 233, 0.06)
    check_color = rgba(120, 255, 220, 1.0)
    fail_color = $danger
    font_color = $ice
    font_family = $f_text
    dots_text_format = *
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span letter_spacing="5000" alpha="65%"> ❯ ACCESS LOCKED </span>
    fail_text = <span letter_spacing="2000">LETHAL ELIMINATOR · $ATTEMPTS</span>
    fail_transition = 300
    capslock_color = rgba(240, 190, 110, 1.0)
    position = 0, -225
    halign = center
    valign = center
    zindex = 5
}

# dominator status: follows the reading
#   < 100 trigger locked | 100-299 paralyzer | 300+ eliminator | glitch: rechecking
label {
    monitor =
    text = cmd[update:1000] t=$(( $(date +%s) / $step )); u=$(( t / 3 )); q=$(( (u * 1103515245 + 12345) / 65536 % 32768 )); z=$(( (q % 3 + (1 + q / 3 % 2) * (t % 3)) % 3 )); r=$(( (t * 1103515245 + 12345) / 65536 % 32768 )); case $z in 0) n=$(( r % 100 ));; 1) n=$(( 100 + r % 200 ));; *) n=$(( 300 + r % 700 ));; esac; g=$(( t % 23 )); if [ "$g" -eq 0 ]; then w="SIBYL · RECHECKING"; c=968ce6; elif [ "$n" -ge 300 ]; then w="DOMINATOR · LETHAL ELIMINATOR"; c=ff463c; elif [ "$n" -ge 100 ]; then w="DOMINATOR · NON-LETHAL PARALYZER"; c=968ce6; else w="DOMINATOR · TRIGGER LOCKED"; c=93cee9; fi; printf '<span letter_spacing="3500" foreground="\043%s">%s</span>' "$c" "$w"
    color = $faint
    font_size = 12
    font_family = $f_text
    position = 0, -278
    halign = center
    valign = center
    zindex = 5
}

