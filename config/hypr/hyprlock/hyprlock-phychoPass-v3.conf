label {
    monitor =
    text = cmd[update:1000] t=$(( $(date +%s) / $step )); u=$(( t / 3 )); q=$(( (u * 1103515245 + 12345) / 65536 % 32768 )); z=$(( (q % 3 + (1 + q / 3 % 2) * (t % 3)) % 3 )); r=$(( (t * 1103515245 + 12345) / 65536 % 32768 )); case $z in 0) n=$(( r % 100 ));; 1) n=$(( 100 + r % 200 ));; *) n=$(( 300 + r % 700 ));; esac; g=$(( t % 23 )); if [ "$g" -eq 0 ]; then hw="???"; v="???"; c=968ce6; elif [ "$n" -ge 300 ]; then hw=CLOUDY; v=$(printf '%03d' "$n"); c=ff463c; elif [ "$n" -ge 100 ]; then hw=CLOUDY; v=$(printf '%03d' "$n"); c=968ce6; else hw=CLEAR; v=$(printf '%03d' "$n"); c=93cee9; fi; printf '<span letter_spacing="4000">HUE: <span foreground="\043%s">%s</span>  ·  CRIME COEFFICIENT: <span foreground="\043%s">%s</span></span>' "$c" "$hw" "$c" "$v"
