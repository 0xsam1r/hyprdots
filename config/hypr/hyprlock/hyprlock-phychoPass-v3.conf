#
# SAMIR AHMED: Public Safety Bureau, Technical Ops (the Ghost in the Network)
#
# Kogami's frame + v2's edge HUD, rebuilt for the guy who checks the system instead
# of trusting it:
#   - the Psycho-Pass is what SIBYL claims about you: every $step s it moves to another zone
#     (clear / cloudy / red, equally often) and the hue word, colour and Dominator mode follow it
#   - every 23 steps the reading glitches (???  /  RECHECKING)
#   - after midnight the greeting turns into "THE CASE CAN WAIT"
#   - edge text is dimmed (two tiers) so the clock and the live reading win the eye
# Wrong password flips the input to LETHAL ELIMINATOR.
#
# Positions are in px, measured on 1920x1080.
# Center items: (0,0) = screen center, +y goes up.
# Edge items: offsets are from the edge they are aligned to (top uses -y, bottom uses +y).

$fn_splash="$(hyprctl splash)"

# ---------- edit these ----------
$name = "$(whoami)"
# The Psycho-Pass reading visits all three zones equally:
#   0-99 CLEAR (trigger locked) | 100-299 CLOUDY (paralyzer) | 300-999 RED (lethal eliminator)
# Every 3 steps each zone shows up exactly once, in a random order, so no zone can hog the
# screen: one third of the time each, and never more than 2 steps in a row.
#
# How often the reading moves to the next step, in seconds (whole numbers only):
#   1 = fast | 2 = default | 3 = calm
$step = 3

# ---------- palette ----------
$ice     = rgba(147, 206, 233, 1.0)
$violet  = rgba(150, 140, 230, 1.0)
$muted   = rgba(147, 206, 233, 0.88)
$faint   = rgba(147, 206, 233, 0.62)
$bracket = rgba(147, 206, 233, 0.75)
$danger  = rgba(255, 70, 60, 1.0)
# two tiers for the edge text: turn these up if it gets too quiet
$bright  = rgba(147, 206, 233, 0.80)
$dim     = rgba(147, 206, 233, 0.52)

# ---------- fonts ----------
$f_big  = Geist Mono Light
$f_text = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = BIOMETRIC SCAN READY
        present_message = ANALYZING...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ---------- background: darker than before so edge text stays readable ----------
background {
    monitor =
    path = screenshot
    # path = ~/.config/hypr/wallpapers/lock.jpg   # use a fixed image instead
    blur_passes = 3
    blur_size = 6
    noise = 0.025
    contrast = 0.9
    brightness = 0.40
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(4, 12, 24, 0.50)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}
