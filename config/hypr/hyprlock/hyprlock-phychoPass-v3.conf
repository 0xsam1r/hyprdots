# ---- top-left: bureau + shell identity ----
label {
    monitor =
text = cmd[] printf '<span letter_spacing="2500"><b>SIBYL LOCK SCREEN SYSTEM</b>\nACCESS TERMINAL · LOCKED\n❯ ASK %s FOR PERMISSION :) </span>' "$(whoami | tr a-z A-Z)"
    text_align = left
    color = $bright
    font_size = 14
    font_family = $f_text
    position = 80, -72
    halign = left
    valign = top
    zindex = 3
}

# ---- top-right: node, uptime, kernel ----
label {
    monitor =
    text = cmd[update:30000] printf '<span letter_spacing="2500">NODE %s\nUPTIME %s\nKERNEL %s</span>' "$(hostname | tr a-z A-Z)" "$(uptime -p | sed -e 's/^up //' -e 's/ days\?/D/' -e 's/ hours\?/H/' -e 's/ minutes\?/M/' -e 's/,//' | tr a-z A-Z)" "$(uname -r | cut -d- -f1)"
    text_align = right
    color = $dim
    font_size = 14
    font_family = $f_text
    position = -80, -72
    halign = right
    valign = top
    zindex = 3
}

# ---- bottom-left: keyboard layout ----
label {
    monitor =
    text = <span letter_spacing="2500">[ $LAYOUT ]</span>
    color = $dim
    font_size = 14
    font_family = $f_text
    position = 80, 72
    halign = left
    valign = bottom
    zindex = 3
}

# ---- bottom-right: battery (▲ charging, ▼ discharging, ■ full) ----
label {
    monitor =
    text = cmd[update:2000] c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); s=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1); case "$s" in Charging) i="▲";; Discharging) i="▼";; *) i="■";; esac; [ -n "$c" ] && { case $(( (c+10)/20 )) in 0) b="▱▱▱▱▱";; 1) b="▰▱▱▱▱";; 2) b="▰▰▱▱▱";; 3) b="▰▰▰▱▱";; 4) b="▰▰▰▰▱";; *) b="▰▰▰▰▰";; esac; printf '<span letter_spacing="2500"> %s%% [%s] %s</span>' "$c" "$b" "$i"; }
    color = $dim
    font_size = 14
    font_family = $f_text
    position = -80, 72
    halign = right
    valign = bottom
    zindex = 3
}

# ---- bottom-center: splash, live reading, fingerprint ----
label {
    monitor =
  text = cmd[update:60000] hyprctl splash | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g'
    color = $bright
    font_size = 15
    font_family = $f_text
    position = 0, 78
    halign = center
    valign = bottom
    zindex = 3
}

