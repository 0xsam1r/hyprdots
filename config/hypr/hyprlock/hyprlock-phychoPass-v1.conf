#
# SIBYL TERMINAL: Psycho-Pass inspired sci-fi lockscreen
#
# Center  : stacked clock (hour = clear hue, minutes = cloudy hue), date, one input. Nothing else.
# Edges   : corner brackets + tiny HUD text, kept faint so they never compete with the clock.
#
# Positions are in px, measured on 1920x1080.
# Center items: (0,0) = screen center, +y goes up.
# Edge items: offsets are from the edge they are aligned to (top uses -y, bottom uses +y).

# ---------- palette ----------
$ice     = rgba(147, 206, 233, 1.0)
$violet  = rgba(150, 140, 230, 1.0)
$muted   = rgba(147, 206, 233, 0.50)
$faint   = rgba(147, 206, 233, 0.30)
$bracket = rgba(147, 206, 233, 0.55)
$danger  = rgba(255, 90, 80, 1.0)

# ---------- fonts ----------
# Check with `fc-list | grep -i geist`; pango falls back silently if one is missing.
$f_big  = Geist Mono Light
$f_text = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = BIOMETRIC SCAN READY
        present_message = ANALYZING...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ---------- background: your screen, cold and dark ----------
background {
    monitor =
    path = screenshot
    # path = ~/.config/hypr/wallpapers/lock.jpg   # use a fixed image instead
    blur_passes = 3
    blur_size = 5
    noise = 0.02
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# cold blue tint over everything
shape {
    monitor =
    size = 100%, 100%
    color = rgba(4, 12, 24, 0.40)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# =====================================================
#                      CENTER
# =====================================================

# hour: clear hue
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $ice
    font_size = 150
    font_family = $f_big
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.7)
    shadow_boost = 1.0
    position = 0, 110
    halign = center
    valign = center
    zindex = 5
}

# minutes: cloudy hue
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $violet
    font_size = 150
    font_family = $f_big
    position = 0, -60
    halign = center
    valign = center
    zindex = 5
}

# date, tracked-out caps
label {
    monitor =
    text = cmd[update:60000] printf '<span letter_spacing="5000">%s</span>' "$(date +'%a · %d %b %Y' | tr a-z A-Z)"
    color = $muted
    font_size = 13
    font_family = $f_text
    position = 0, -170
    halign = center
    valign = center
    zindex = 5
}

# the only input
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(147, 206, 233, 0.60)
    inner_color = rgba(147, 206, 233, 0.04)
    check_color = rgba(120, 255, 220, 1.0)
    fail_color = $danger
    font_color = $ice
    font_family = $f_text
    dots_text_format = *
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span letter_spacing="4000" foreground="##93cee9" alpha="55%">AUTHENTICATE</span>
    fail_text = <span letter_spacing="2000">COEFFICIENT ELEVATED · $ATTEMPTS</span>
    fail_transition = 300
    capslock_color = rgba(240, 190, 110, 1.0)
    position = 0, -260
    halign = center
    valign = center
    zindex = 5
}

# =====================================================
#                  EDGES / HUD (faint)
# =====================================================

# ---- corner brackets (inset 40px) ----
# top-left
shape {
    monitor =
    size = 60, 2
    color = $bracket
    rounding = 0
    position = 40, -40
    halign = left
    valign = top
    zindex = 2
}
shape {
    monitor =
    size = 2, 60
    color = $bracket
    rounding = 0
    position = 40, -40
    halign = left
    valign = top
    zindex = 2
}
# top-right
shape {
    monitor =
    size = 60, 2
    color = $bracket
    rounding = 0
    position = -40, -40
    halign = right
    valign = top
    zindex = 2
}
shape {
    monitor =
    size = 2, 60
    color = $bracket
    rounding = 0
    position = -40, -40
    halign = right
    valign = top
    zindex = 2
}
# bottom-left
shape {
    monitor =
    size = 60, 2
    color = $bracket
    rounding = 0
    position = 40, 40
    halign = left
    valign = bottom
    zindex = 2
}
shape {
    monitor =
    size = 2, 60
    color = $bracket
    rounding = 0
    position = 40, 40
    halign = left
    valign = bottom
    zindex = 2
}
# bottom-right
shape {
    monitor =
    size = 60, 2
    color = $bracket
    rounding = 0
    position = -40, 40
    halign = right
    valign = bottom
    zindex = 2
}
shape {
    monitor =
    size = 2, 60
    color = $bracket
    rounding = 0
    position = -40, 40
    halign = right
    valign = bottom
    zindex = 2
}

# ---- top-left: system tag ----
label {
    monitor =
    text = cmd[update:60000] printf '<span letter_spacing="2500"><b>SIBYL SYSTEM</b>\nACCESS TERMINAL · LOCKED</span>'
    text_align = left
    color = $muted
    font_size = 11
    font_family = $f_text
    position = 72, -64
    halign = left
    valign = top
    zindex = 3
}

# ---- top-right: node + uptime ----
label {
    monitor =
    text = cmd[update:30000] printf '<span letter_spacing="2500">NODE %s\nUPTIME %s</span>' "$(hostname | tr a-z A-Z)" "$(uptime -p | sed 's/^up //' | tr a-z A-Z)"
    text_align = right
    color = $muted
    font_size = 11
    font_family = $f_text
    position = -72, -64
    halign = right
    valign = top
    zindex = 3
}

# ---- bottom-left: keyboard layout ----
label {
    monitor =
    text = <span letter_spacing="2500">[ $LAYOUT ]</span>
    color = $faint
    font_size = 11
    font_family = $f_text
    position = 72, 64
    halign = left
    valign = bottom
    zindex = 3
}

# ---- bottom-center: hue status + fingerprint ----
label {
    monitor =
    text = <span letter_spacing="4000">HUE: CLEAR  ·  CRIME COEFFICIENT: 0</span>
    color = $faint
    font_size = 11
    font_family = $f_text
    position = 0, 64
    halign = center
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = <span letter_spacing="3000">$FPRINTPROMPT</span>
    color = $faint
    font_size = 10
    font_family = $f_text
    position = 0, 40
    halign = center
    valign = bottom
    zindex = 3
}

