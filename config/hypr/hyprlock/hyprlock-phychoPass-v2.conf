#        |___/|_|
#
# SIBYL TERMINAL v2: all the vibes mixed
#   Psycho-Pass : hue clear/cloudy clock, crime coefficient, Sibyl HUD, red on failure
#   Ghostpunk   : #93cee9 ice-blue, mono fonts, shell prompt line, ghost glyph
#   layout1     : stacked hour/minutes + a greeting
#   layout6     : "Good <time of day>, NAME" + system status
#
# Center is still just clock, date and input. All the extra text lives on the edges,
# bigger and brighter than v1 so it is actually readable.
# Positions are in px, measured on 1920x1080.

# ---------- edit these ----------
$display_name = SAMIR

# ---------- palette ----------
$ice     = rgba(147, 206, 233, 1.0)
$violet  = rgba(150, 140, 230, 1.0)
$muted   = rgba(147, 206, 233, 0.85)
$faint   = rgba(147, 206, 233, 0.60)
$bracket = rgba(147, 206, 233, 0.70)
$danger  = rgba(255, 90, 80, 1.0)

# ---------- fonts ----------
$f_big  = Geist Mono Light
$f_text = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = BIOMETRIC SCAN READY
        present_message = ANALYZING...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    # path = ~/.config/hypr/wallpapers/lock.jpg   # use a fixed image instead
    blur_passes = 3
    blur_size = 5
    noise = 0.02
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.1
    vibrancy_darkness = 0.0
}

# cold blue tint
shape {
    monitor =
    size = 100%, 100%
    color = rgba(4, 12, 24, 0.40)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# =====================================================
#                      CENTER
# =====================================================

# ghost mark above the clock
label {
    monitor =
    text = 󰊠
    color = $faint
    font_size = 26
    font_family = $f_text
    position = 0, 250
    halign = center
    valign = center
    zindex = 5
}

# hour: clear hue (ice glow)
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $ice
    font_size = 150
    font_family = $f_big
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(147, 206, 233, 0.55)
    shadow_boost = 1.2
    position = 0, 110
    halign = center
    valign = center
    zindex = 5
}

# minutes: cloudy hue (violet glow)
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $violet
    font_size = 150
    font_family = $f_big
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(150, 140, 230, 0.55)
    shadow_boost = 1.2
    position = 0, -60
    halign = center
    valign = center
    zindex = 5
}

# date, bigger and brighter
label {
    monitor =
    text = cmd[update:60000] printf '<span letter_spacing="6000">%s</span>' "$(date +'%a · %d %b %Y' | tr a-z A-Z)"
    color = $muted
    font_size = 17
    font_family = $f_text
    position = 0, -170
    halign = center
    valign = center
    zindex = 5
}

# input
input-field {
    monitor =
    size = 340, 50
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(147, 206, 233, 0.70)
    inner_color = rgba(147, 206, 233, 0.05)
    check_color = rgba(120, 255, 220, 1.0)
    fail_color = $danger
    font_color = $ice
    font_family = $f_text
    dots_text_format = *
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span letter_spacing="5000" alpha="65%">❯ AUTHENTICATE</span>
    fail_text = <span letter_spacing="2000">COEFFICIENT ELEVATED · $ATTEMPTS</span>
    fail_transition = 300
    capslock_color = rgba(240, 190, 110, 1.0)
    position = 0, -260
    halign = center
    valign = center
    zindex = 5
}

# =====================================================
#                       EDGES
# =====================================================

# ---- corner brackets (inset 40px) ----
shape {
    monitor =
    size = 70, 2
    color = $bracket
    rounding = 0
    position = 40, -40
    halign = left
    valign = top
    zindex = 2
}
shape {
    monitor =
    size = 2, 70
    color = $bracket
    rounding = 0
    position = 40, -40
    halign = left
    valign = top
    zindex = 2
}
shape {
    monitor =
    size = 70, 2
    color = $bracket
    rounding = 0
    position = -40, -40
    halign = right
    valign = top
    zindex = 2
}
shape {
    monitor =
    size = 2, 70
    color = $bracket
    rounding = 0
    position = -40, -40
    halign = right
    valign = top
    zindex = 2
}
shape {
    monitor =
    size = 70, 2
    color = $bracket
    rounding = 0
    position = 40, 40
    halign = left
    valign = bottom
    zindex = 2
}
shape {
    monitor =
    size = 2, 70
    color = $bracket
    rounding = 0
    position = 40, 40
    halign = left
    valign = bottom
    zindex = 2
}
shape {
    monitor =
    size = 70, 2
    color = $bracket
    rounding = 0
    position = -40, 40
    halign = right
    valign = bottom
    zindex = 2
}
shape {
    monitor =
    size = 2, 70
    color = $bracket
    rounding = 0
    position = -40, 40
    halign = right
    valign = bottom
    zindex = 2
}

# ---- top-left: Sibyl tag + shell identity ----
label {
    monitor =
    text = cmd[update:60000] printf '<span letter_spacing="2500"><b>SIBYL SYSTEM</b>\nACCESS TERMINAL · LOCKED\n❯ %s@%s</span>' "$(whoami)" "$(hostname)"
    text_align = left
    color = $muted
    font_size = 14
    font_family = $f_text
    position = 80, -72
    halign = left
    valign = top
    zindex = 3
}

# ---- top-right: node, uptime, kernel ----
label {
    monitor =
    text = cmd[update:30000] printf '<span letter_spacing="2500">NODE %s\nUPTIME %s\nKERNEL %s</span>' "$(hostname | tr a-z A-Z)" "$(uptime -p | sed -e 's/^up //' -e 's/ days\?/D/' -e 's/ hours\?/H/' -e 's/ minutes\?/M/' -e 's/,//' | tr a-z A-Z)" "$(uname -r | cut -d- -f1)"
    text_align = right
    color = $muted
    font_size = 14
    font_family = $f_text
    position = -80, -72
    halign = right
    valign = top
    zindex = 3
}

# ---- bottom-left: keyboard layout ----
label {
    monitor =
    text = <span letter_spacing="2500">[ $LAYOUT ]</span>
    color = $faint
    font_size = 14
    font_family = $f_text
    position = 80, 72
    halign = left
    valign = bottom
    zindex = 3
}

# ---- bottom-right: battery (▲ charging, ▼ discharging, ■ full) ----
label {
    monitor =
    text = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1); s=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null | head -n1); case "$s" in Charging) i="▲";; Discharging) i="▼";; *) i="■";; esac; [ -n "$c" ] && printf '<span letter_spacing="2500">BAT %s%% %s</span>' "$c" "$i"
    color = $faint
    font_size = 14
    font_family = $f_text
    position = -80, 72
    halign = right
    valign = bottom
    zindex = 3
}

# ---- bottom-center: greeting, hue status, fingerprint ----
label {
    monitor =
    text = cmd[update:60000] h=$(date +%H); if [ "$h" -lt 5 ]; then g=NIGHT; elif [ "$h" -lt 12 ]; then g=MORNING; elif [ "$h" -lt 18 ]; then g=AFTERNOON; else g=EVENING; fi; printf '<span letter_spacing="4000"><i>GOOD %s, %s</i></span>' "$g" "$display_name"
    color = $violet
    font_size = 17
    font_family = $f_text
    position = 0, 125
    halign = center
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = <span letter_spacing="4000">HUE: CLEAR  ·  CRIME COEFFICIENT: 0</span>
    color = $faint
    font_size = 13
    font_family = $f_text
    position = 0, 78
    halign = center
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = <span letter_spacing="3000">$FPRINTPROMPT</span>
    color = $faint
    font_size = 12
    font_family = $f_text
    position = 0, 48
    halign = center
    valign = bottom
    zindex = 3
}
